<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Invaders V5.4</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#7fa9bf;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{
  alpha:false,
  desynchronized:true
});

let W=innerWidth;
let H=innerHeight;

/*
  PERFORMANCE CHANGE:
  render at CSS-pixel resolution.

  Safari then doesn't have to process
  a giant Retina canvas every frame.
*/
function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=Math.round(W);
  canvas.height=Math.round(H);

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="medium";
}

resize();
addEventListener("resize",resize);


// =====================================
// ASSETS
// =====================================

const ASSETS={
  background:"A2AE5350-54C3-4BD9-9090-6061E6C83F85.png",
  player:"8BBBE99D-BE50-463D-AB99-9356374B034D.png",
  enemy:"223E8F5F-AC53-4AC9-9DAE-CCF47D50F608.png",
  top:"8DCB4E86-B1D1-49F0-9B39-F9719AC68DFA.png",
  bottom:"3FC9FF8B-E285-4302-B4B1-4B4F22CC01EB.png"
};

const backgroundImg=new Image();
const raptorImg=new Image();
const enemyImg=new Image();
const topRuinImg=new Image();
const bottomRuinImg=new Image();


// =====================================
// PRE-RENDERED ART
// =====================================

let backgroundCache=null;
let topCache=null;
let bottomCache=null;

let assetsLoaded=false;


/*
  Make a smaller canvas copy ONCE.

  The game then draws these lightweight
  cached canvases instead of resizing
  the original huge PNG every frame.
*/
function makeCache(img,width){

  const ratio=
    img.naturalHeight/
    img.naturalWidth;

  const c=document.createElement("canvas");

  c.width=Math.round(width);
  c.height=Math.round(width*ratio);

  const cctx=c.getContext("2d",{
    alpha:true
  });

  cctx.imageSmoothingEnabled=true;
  cctx.imageSmoothingQuality="high";

  cctx.drawImage(
    img,
    0,
    0,
    c.width,
    c.height
  );

  return c;
}


function buildCaches(){

  /*
    Ruins are cached close to the
    exact size they appear on screen.
  */

  topCache=
    makeCache(
      topRuinImg,
      260
    );

  bottomCache=
    makeCache(
      bottomRuinImg,
      260
    );


  /*
    Background gets reduced once too.
    900px is plenty for an iPhone
    game canvas.
  */

  backgroundCache=
    makeCache(
      backgroundImg,
      900
    );
}


// =====================================
// PRELOAD EVERYTHING
// =====================================

function loadImage(img,src){

  return new Promise(resolve=>{

    img.onload=resolve;

    img.onerror=resolve;

    img.src=src;
  });
}


Promise.all([

  loadImage(
    backgroundImg,
    ASSETS.background
  ),

  loadImage(
    raptorImg,
    ASSETS.player
  ),

  loadImage(
    enemyImg,
    ASSETS.enemy
  ),

  loadImage(
    topRuinImg,
    ASSETS.top
  ),

  loadImage(
    bottomRuinImg,
    ASSETS.bottom
  )

]).then(()=>{

  if(
    backgroundImg.naturalWidth &&
    topRuinImg.naturalWidth &&
    bottomRuinImg.naturalWidth
  ){
    buildCaches();
  }

  assetsLoaded=true;
});


// =====================================
// GAME STATE
// =====================================

let state="start";

let score=0;
let high=
  Number(
    localStorage.dinoHigh||0
  );

let frame=0;
let worldX=0;
let recoil=0;

let bullets=[];
let enemies=[];
let ruins=[];
let particles=[];

const player={
  x:82,
  y:300,
  vy:0,
  r:16
};


// =====================================
// RESET
// =====================================

function reset(){

  score=0;
  frame=0;
  worldX=0;
  recoil=0;

  player.y=H*.45;
  player.vy=0;

  bullets.length=0;
  enemies.length=0;
  ruins.length=0;
  particles.length=0;
}


function startGame(){

  if(!assetsLoaded){
    return;
  }

  reset();

  state="play";
}


// =====================================
// INPUT
// =====================================

function tap(){

  if(
    state==="start" ||
    state==="dead"
  ){

    startGame();
    return;
  }

  player.vy=-7.1;

  shoot();


  for(let i=0;i<3;i++){

    particles.push({

      x:player.x-34,
      y:player.y+7,

      vx:-2-Math.random()*2,
      vy:(Math.random()-.5)*2,

      life:13,

      size:
        2+
        Math.random()*2,

      type:"red"
    });
  }
}


function shoot(){

  bullets.push({

    x:player.x+46,
    y:player.y-4,

    vx:10,
    r:5
  });

  recoil=5;
}


// =====================================
// SPAWN RUINS
// =====================================

function spawnRuin(){

  const gap=Math.max(
    205,
    Math.min(
      240,
      H*.32
    )
  );

  const margin=95;

  const minCenter=
    margin+
    gap/2;

  const maxCenter=
    H-
    margin-
    gap/2;

  let center=H*.5;


  if(maxCenter>minCenter){

    center=
      minCenter+
      Math.random()*
      (maxCenter-minCenter);
  }


  ruins.push({

    x:W+190,

    visualW:260,

    /*
      Collision is intentionally
      narrower than the artwork.
    */

    hitW:128,

    top:
      center-
      gap/2,

    bottom:
      center+
      gap/2,

    passed:false
  });
}


// =====================================
// SPAWN ENEMY
// =====================================

function spawnEnemy(){

  enemies.push({

    x:W+90,

    baseY:
      105+
      Math.random()*
      Math.max(
        90,
        H-230
      ),

    y:H*.5,

    vx:
      2.6+
      Math.random()*.7,

    r:19,

    phase:
      Math.random()*
      Math.PI*2
  });
}


// =====================================
// PARTICLES
// =====================================

function explode(x,y,type){

  /*
    Slightly fewer particles than V5.3
    to reduce spikes during explosions.
  */

  for(let i=0;i<9;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*6,

      vy:
        (Math.random()-.5)*6,

      life:
        17+
        Math.random()*8,

      size:
        2+
        Math.random()*3,

      type
    });
  }
}


// =====================================
// COLLISION
// =====================================

function circleHit(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  const rr=a.r+b.r;

  return(
    dx*dx+
    dy*dy<
    rr*rr
  );
}


function die(){

  if(state!=="play"){
    return;
  }

  state="dead";

  explode(
    player.x,
    player.y,
    "red"
  );


  if(score>high){

    high=score;

    localStorage.dinoHigh=high;
  }
}


// =====================================
// UPDATE
// =====================================

function update(){

  if(recoil>.05){
    recoil*=.7;
  }else{
    recoil=0;
  }


  // PARTICLES

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.life--;


    if(p.life<=0){
      particles.splice(i,1);
    }
  }


  if(state!=="play"){
    return;
  }


  frame++;

  worldX+=2.55;


  // PLAYER

  player.vy+=.38;
  player.y+=player.vy;


  if(
    player.y<18 ||
    player.y>H-28
  ){
    die();
  }


  // SPAWN

  if(frame%126===0){
    spawnRuin();
  }


  if(frame%170===0){
    spawnEnemy();
  }


  // BULLETS

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b=bullets[i];

    b.x+=b.vx;


    if(b.x>W+50){
      bullets.splice(i,1);
    }
  }


  // RUINS

  for(
    let i=ruins.length-1;
    i>=0;
    i--
  ){

    const r=ruins[i];

    r.x-=2.55;


    const hitLeft=
      r.x+
      (r.visualW-r.hitW)/2;

    const hitRight=
      hitLeft+
      r.hitW;


    if(
      !r.passed &&
      hitRight<
      player.x
    ){

      r.passed=true;
      score++;
    }


    if(

      player.x+
      player.r>
      hitLeft &&

      player.x-
      player.r<
      hitRight &&

      (

        player.y-
        player.r<
        r.top ||

        player.y+
        player.r>
        r.bottom

      )

    ){
      die();
    }


    if(
      r.x<
      -r.visualW-30
    ){
      ruins.splice(i,1);
    }
  }


  // ENEMIES

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];

    e.x-=e.vx;


    e.y=
      e.baseY+
      Math.sin(
        frame*.05+
        e.phase
      )*13;


    if(circleHit(player,e)){
      die();
    }


    for(
      let j=bullets.length-1;
      j>=0;
      j--
    ){

      const b=bullets[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;

      const rr=b.r+e.r;


      if(
        dx*dx+
        dy*dy<
        rr*rr
      ){

        explode(
          e.x,
          e.y,
          "orange"
        );

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=2;

        break;
      }
    }


    if(
      enemies[i] &&
      enemies[i].x<-120
    ){
      enemies.splice(i,1);
    }
  }
}


// =====================================
// BACKGROUND
// =====================================

function drawBackground(){

  if(!backgroundCache){

    ctx.fillStyle="#7fa9bf";

    ctx.fillRect(
      0,0,W,H
    );

    return;
  }


  const iw=
    backgroundCache.width;

  const ih=
    backgroundCache.height;


  /*
    Cover the phone screen.
  */

  const scale=
    Math.max(
      W/iw,
      H/ih
    );


  const sourceW=
    Math.min(
      iw,
      W/scale
    );

  const sourceH=
    Math.min(
      ih,
      H/scale
    );


  const maxX=
    Math.max(
      0,
      iw-sourceW
    );


  let sx=0;


  if(maxX>1){

    /*
      Ping-pong movement instead of
      wrapping the background seam.
    */

    const travel=
      (worldX*.025)%
      (maxX*2);

    sx=
      travel<=maxX
      ? travel
      : maxX*2-travel;
  }


  const sy=
    Math.max(
      0,
      (ih-sourceH)*.48
    );


  ctx.drawImage(

    backgroundCache,

    sx,
    sy,

    sourceW,
    sourceH,

    0,
    0,

    W,
    H
  );
}


// =====================================
// TOP RUIN
// =====================================

function drawTopRuin(r){

  if(!topCache){
    return;
  }


  /*
    Cached image is already 260px wide.

    No resizing of the original PNG
    happens here.
  */

  const drawW=
    r.visualW;

  const naturalH=
    topCache.height;


  /*
    Extend upward beyond the screen
    rather than stretching the image.
  */

  const bottomY=
    r.top+18;

  const drawY=
    bottomY-
    naturalH;


  ctx.drawImage(

    topCache,

    Math.round(r.x),
    Math.round(drawY)
  );


  /*
    If the artwork doesn't reach the
    very top, continue it with a dark
    rock backing behind the image.
  */

  if(drawY>0){

    ctx.fillStyle="#26382e";

    ctx.fillRect(
      Math.round(r.x+24),
      0,
      drawW-48,
      Math.ceil(drawY+5)
    );

    /*
      Redraw image so it stays above
      the simple backing.
    */

    ctx.drawImage(
      topCache,
      Math.round(r.x),
      Math.round(drawY)
    );
  }
}


// =====================================
// BOTTOM RUIN
// =====================================

function drawBottomRuin(r){

  if(!bottomCache){
    return;
  }


  const drawY=
    r.bottom-18;


  /*
    Again: cached asset is drawn at
    native cached size. No expensive
    resize every frame.
  */

  ctx.drawImage(

    bottomCache,

    Math.round(r.x),
    Math.round(drawY)
  );


  /*
    Continue the structure below the
    image if necessary.
  */

  const imageBottom=
    drawY+
    bottomCache.height;


  if(imageBottom<H){

    ctx.fillStyle="#26382e";

    ctx.fillRect(

      Math.round(r.x+24),

      Math.floor(
        imageBottom-3
      ),

      r.visualW-48,

      H-imageBottom+5
    );
  }
}


// =====================================
// PLAYER
// =====================================

function drawPlayer(){

  ctx.save();


  ctx.translate(
    Math.round(
      player.x-recoil
    ),
    Math.round(
      player.y
    )
  );


  const angle=
    Math.max(
      -.17,
      Math.min(
        .20,
        player.vy*.023
      )
    );


  ctx.rotate(angle);


  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const w=155;

    const h=
      w*
      raptorImg.naturalHeight/
      raptorImg.naturalWidth;


    ctx.drawImage(

      raptorImg,

      -w*.47,
      -h*.5,

      w,
      h
    );

  }else{

    ctx.fillStyle="#d9302c";

    ctx.beginPath();

    ctx.arc(
      0,0,18,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.restore();
}


// =====================================
// ENEMY
// =====================================

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    Math.round(e.x),
    Math.round(e.y)
  );

  ctx.scale(-1,1);


  if(
    enemyImg.complete &&
    enemyImg.naturalWidth
  ){

    const w=100;

    const h=
      w*
      enemyImg.naturalHeight/
      enemyImg.naturalWidth;


    ctx.drawImage(

      enemyImg,

      -w/2,
      -h/2,

      w,
      h
    );

  }


  ctx.restore();
}


// =====================================
// BULLETS
// =====================================

function drawBullets(){

  ctx.fillStyle="#ff352d";


  for(const b of bullets){

    ctx.beginPath();

    ctx.ellipse(
      b.x,
      b.y,
      13,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


// =====================================
// PARTICLES
// =====================================

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/25
      );


    ctx.fillStyle=
      p.type==="orange"
      ? "#ff9a25"
      : "#ff3933";


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.globalAlpha=1;
}


// =====================================
// HUD
// =====================================

function drawHUD(){

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 30px Arial";


  ctx.fillText(
    score,
    W/2,
    52
  );


  ctx.font=
    "bold 14px Arial";


  ctx.fillText(
    "BEST "+high,
    W/2,
    75
  );
}


// =====================================
// START SCREEN
// =====================================

function drawStart(){

  ctx.fillStyle=
    "rgba(12,28,24,.65)";


  ctx.fillRect(
    22,
    H*.25,
    W-44,
    260
  );


  ctx.textAlign="center";


  ctx.fillStyle="#fff";

  ctx.font=
    "bold 38px Arial";


  ctx.fillText(
    "DINO",
    W/2,
    H*.34
  );


  ctx.fillStyle="#ff3933";


  ctx.fillText(
    "INVADERS",
    W/2,
    H*.40
  );


  ctx.fillStyle="#fff";

  ctx.font="16px Arial";


  ctx.fillText(
    assetsLoaded
      ? "CYBER RAPTOR ONLINE"
      : "LOADING SYSTEMS...",
    W/2,
    H*.49
  );


  if(assetsLoaded){

    ctx.font=
      "bold 21px Arial";


    ctx.fillText(
      "TAP TO START",
      W/2,
      H*.59
    );
  }
}


// =====================================
// DEAD
// =====================================

function drawDead(){

  ctx.fillStyle=
    "rgba(12,28,24,.72)";


  ctx.fillRect(
    25,
    H*.32,
    W-50,
    210
  );


  ctx.textAlign="center";


  ctx.fillStyle="#ff3933";

  ctx.font=
    "bold 31px Arial";


  ctx.fillText(
    "SYSTEM DOWN",
    W/2,
    H*.41
  );


  ctx.fillStyle="#fff";

  ctx.font=
    "21px Arial";


  ctx.fillText(
    "Score: "+score,
    W/2,
    H*.48
  );


  ctx.font=
    "bold 20px Arial";


  ctx.fillText(
    "TAP TO REBOOT",
    W/2,
    H*.57
  );
}


// =====================================
// DRAW
// =====================================

function draw(){

  drawBackground();


  for(const r of ruins){

    drawTopRuin(r);
    drawBottomRuin(r);
  }


  drawBullets();


  for(const e of enemies){
    drawEnemy(e);
  }


  drawParticles();

  drawPlayer();

  drawHUD();


  if(state==="start"){
    drawStart();
  }


  if(state==="dead"){
    drawDead();
  }
}


// =====================================
// FIXED UPDATE LOOP
// =====================================

let previousTime=performance.now();
let accumulator=0;

const STEP=1000/60;


/*
  Fixed game updates prevent physics
  from changing speed when Safari
  briefly drops a frame.
*/
function loop(now){

  let delta=
    now-
    previousTime;

  previousTime=now;


  /*
    Prevent giant catch-up jumps.
  */

  if(delta>80){
    delta=80;
  }


  accumulator+=delta;


  while(accumulator>=STEP){

    update();

    accumulator-=STEP;
  }


  draw();

  requestAnimationFrame(loop);
}


// =====================================
// INPUT
// =====================================

canvas.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    tap();
  },
  {passive:false}
);


requestAnimationFrame(loop);

</script>
</body>
</html>
