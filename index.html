<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Invaders V5.2</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#7fa9bf;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.25);
  W=innerWidth;
  H=innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);


// ===============================
// ASSETS
// ===============================

const backgroundImg=new Image();
backgroundImg.src=
"A2AE5350-54C3-4BD9-9090-6061E6C83F85.png";

const raptorImg=new Image();
raptorImg.src=
"8BBBE99D-BE50-463D-AB99-9356374B034D.png";

const enemyImg=new Image();
enemyImg.src=
"223E8F5F-AC53-4AC9-9DAE-CCF47D50F608.png";

const ruinImg=new Image();
ruinImg.src=
"3F93822F-F1CA-4436-A3D1-85B1412391AB.png";


// ===============================
// GAME
// ===============================

let state="start";
let score=0;
let high=Number(localStorage.dinoHigh||0);

let frame=0;
let worldX=0;
let recoil=0;

let bullets=[];
let enemies=[];
let ruins=[];
let particles=[];

const player={
  x:82,
  y:300,
  vy:0,
  r:16
};


// ===============================
// RESET
// ===============================

function reset(){
  score=0;
  frame=0;
  worldX=0;
  recoil=0;

  player.y=H*.45;
  player.vy=0;

  bullets=[];
  enemies=[];
  ruins=[];
  particles=[];
}

function startGame(){
  reset();
  state="play";
}


// ===============================
// INPUT
// ===============================

function tap(){

  if(state==="start" || state==="dead"){
    startGame();
    return;
  }

  player.vy=-7.1;
  shoot();

  for(let i=0;i<4;i++){
    particles.push({
      x:player.x-35,
      y:player.y+8,
      vx:-2-Math.random()*2,
      vy:(Math.random()-.5)*2,
      life:15,
      size:2+Math.random()*3,
      type:"red"
    });
  }
}

function shoot(){

  bullets.push({
    x:player.x+46,
    y:player.y-4,
    vx:10,
    r:5
  });

  recoil=5;
}


// ===============================
// SPAWNING
// ===============================

function spawnRuin(){

  const gap=Math.max(190,Math.min(225,H*.31));

  const margin=125;
  const minCenter=margin+gap/2;
  const maxCenter=H-margin-gap/2;

  let center=H*.5;

  if(maxCenter>minCenter){
    center=minCenter+
      Math.random()*(maxCenter-minCenter);
  }

  ruins.push({
    x:W+120,
    w:112,
    top:center-gap/2,
    bottom:center+gap/2,
    passed:false
  });
}


function spawnEnemy(){

  enemies.push({
    x:W+80,

    baseY:
      110+
      Math.random()*
      Math.max(80,H-240),

    y:H*.5,

    vx:
      2.6+
      Math.random()*.7,

    r:19,

    phase:
      Math.random()*Math.PI*2
  });
}


// ===============================
// EFFECTS
// ===============================

function explode(x,y,type){

  for(let i=0;i<12;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:18+Math.random()*10,
      size:2+Math.random()*4,
      type
    });
  }
}


// ===============================
// COLLISION
// ===============================

function circleHit(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;
  const rr=a.r+b.r;

  return dx*dx+dy*dy < rr*rr;
}


function die(){

  if(state!=="play") return;

  state="dead";

  explode(
    player.x,
    player.y,
    "red"
  );

  if(score>high){
    high=score;
    localStorage.dinoHigh=high;
  }
}


// ===============================
// UPDATE
// ===============================

function update(){

  if(recoil>0){
    recoil*=.7;
  }

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }


  if(state!=="play") return;


  frame++;
  worldX+=2.55;


  player.vy+=.38;
  player.y+=player.vy;


  if(
    player.y<18 ||
    player.y>H-28
  ){
    die();
  }


  if(frame%122===0){
    spawnRuin();
  }


  if(frame%165===0){
    spawnEnemy();
  }


  // BULLETS

  for(let i=bullets.length-1;i>=0;i--){

    bullets[i].x+=bullets[i].vx;

    if(bullets[i].x>W+50){
      bullets.splice(i,1);
    }
  }


  // RUINS

  for(let i=ruins.length-1;i>=0;i--){

    const r=ruins[i];

    r.x-=2.55;


    if(
      !r.passed &&
      r.x+r.w<player.x
    ){
      r.passed=true;
      score++;
    }


    if(
      player.x+player.r>r.x &&
      player.x-player.r<r.x+r.w &&
      (
        player.y-player.r<r.top ||
        player.y+player.r>r.bottom
      )
    ){
      die();
    }


    if(r.x<-180){
      ruins.splice(i,1);
    }
  }


  // ENEMIES

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    e.x-=e.vx;

    e.y=
      e.baseY+
      Math.sin(frame*.05+e.phase)*13;


    if(circleHit(player,e)){
      die();
    }


    for(let j=bullets.length-1;j>=0;j--){

      const b=bullets[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;
      const rr=b.r+e.r;

      if(dx*dx+dy*dy<rr*rr){

        explode(e.x,e.y,"orange");

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=2;

        break;
      }
    }


    if(enemies[i] && enemies[i].x<-120){
      enemies.splice(i,1);
    }
  }
}


// ===============================
// BACKGROUND
// ===============================

function drawBackground(){

  if(
    backgroundImg.complete &&
    backgroundImg.naturalWidth
  ){

    const iw=backgroundImg.naturalWidth;
    const ih=backgroundImg.naturalHeight;

    /*
      COVER the screen without
      stretching the artwork.
    */

    const scale=Math.max(
      W/iw,
      H/ih
    );

    const sourceW=W/scale;
    const sourceH=H/scale;

    /*
      Very slow horizontal drift.
      We keep it subtle for
      performance and readability.
    */

    const maxX=Math.max(0,iw-sourceW);

    let sx=0;

    if(maxX>0){
      sx=(worldX*.10)%maxX;
    }

    const sy=Math.max(
      0,
      (ih-sourceH)*.47
    );


    ctx.drawImage(
      backgroundImg,

      sx,
      sy,
      Math.min(sourceW,iw-sx),
      Math.min(sourceH,ih-sy),

      0,
      0,
      W,
      H
    );


    /*
      If horizontal crop reaches
      edge, fill remaining portion.
    */

    const usedSource=
      Math.min(sourceW,iw-sx);

    const usedScreen=
      usedSource*scale;

    if(usedScreen<W){

      const remaining=W-usedScreen;

      ctx.drawImage(
        backgroundImg,

        0,
        sy,
        remaining/scale,
        sourceH,

        usedScreen,
        0,
        remaining,
        H
      );
    }

  }else{

    ctx.fillStyle="#83aebe";
    ctx.fillRect(0,0,W,H);
  }


  /*
    Gentle atmospheric wash keeps
    characters readable without
    making the background empty.
  */

  ctx.fillStyle="rgba(160,190,183,.08)";
  ctx.fillRect(0,0,W,H);
}


// ===============================
// RUINS
// ===============================

function drawRuin(r){

  if(
    !ruinImg.complete ||
    !ruinImg.naturalWidth
  ){

    ctx.fillStyle="#566b57";

    ctx.fillRect(
      r.x,
      0,
      r.w,
      r.top
    );

    ctx.fillRect(
      r.x,
      r.bottom,
      r.w,
      H-r.bottom
    );

    return;
  }


  const iw=ruinImg.naturalWidth;
  const ih=ruinImg.naturalHeight;

  /*
    This artwork contains a clearly
    separated TOP and BOTTOM ruin.

    Crop each structure individually
    and keep the center gap out.
  */

  const topSourceY=0;
  const topSourceH=ih*.47;

  const bottomSourceY=ih*.52;
  const bottomSourceH=ih*.48;


  // TOP

  const topW=155;
  const topH=Math.max(185,r.top+55);

  ctx.drawImage(
    ruinImg,

    0,
    topSourceY,
    iw,
    topSourceH,

    r.x-(topW-r.w)/2,
    r.top-topH+18,

    topW,
    topH
  );


  // BOTTOM

  const bottomW=165;
  const bottomH=
    Math.max(
      190,
      H-r.bottom+45
    );

  ctx.drawImage(
    ruinImg,

    0,
    bottomSourceY,
    iw,
    bottomSourceH,

    r.x-(bottomW-r.w)/2,
    r.bottom-16,

    bottomW,
    bottomH
  );
}


// ===============================
// PLAYER
// ===============================

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x-recoil,
    player.y
  );

  const angle=Math.max(
    -.17,
    Math.min(.20,player.vy*.023)
  );

  ctx.rotate(angle);


  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const w=155;

    const h=
      w*
      raptorImg.naturalHeight/
      raptorImg.naturalWidth;

    ctx.drawImage(
      raptorImg,
      -w*.47,
      -h*.5,
      w,
      h
    );

  }else{

    ctx.fillStyle="#d9302c";
    ctx.beginPath();
    ctx.arc(0,0,18,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}


// ===============================
// ENEMIES
// ===============================

function drawEnemy(e){

  ctx.save();

  ctx.translate(e.x,e.y);

  ctx.scale(-1,1);


  if(
    enemyImg.complete &&
    enemyImg.naturalWidth
  ){

    const w=100;

    const h=
      w*
      enemyImg.naturalHeight/
      enemyImg.naturalWidth;

    ctx.drawImage(
      enemyImg,
      -w/2,
      -h/2,
      w,
      h
    );

  }else{

    ctx.fillStyle="#f7942d";

    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}


// ===============================
// BULLETS
// ===============================

function drawBullets(){

  for(const b of bullets){

    ctx.fillStyle="#ff352d";

    ctx.beginPath();

    ctx.ellipse(
      b.x,
      b.y,
      13,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      b.x+4,
      b.y,
      2.5,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


// ===============================
// PARTICLES
// ===============================

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life/28);

    ctx.fillStyle=
      p.type==="orange"
      ? "#ff9a25"
      : "#ff3933";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


// ===============================
// HUD
// ===============================

function drawHUD(){

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.shadowColor="rgba(0,0,0,.65)";
  ctx.shadowBlur=4;

  ctx.font="bold 30px Arial";

  ctx.fillText(
    score,
    W/2,
    52
  );


  ctx.font="bold 14px Arial";

  ctx.fillText(
    "BEST "+high,
    W/2,
    75
  );

  ctx.shadowBlur=0;
}


// ===============================
// START SCREEN
// ===============================

function drawStart(){

  ctx.fillStyle="rgba(12,28,24,.62)";

  ctx.fillRect(
    22,
    H*.25,
    W-44,
    260
  );


  ctx.textAlign="center";


  ctx.fillStyle="#fff";
  ctx.font="bold 38px Arial";

  ctx.fillText(
    "DINO",
    W/2,
    H*.34
  );


  ctx.fillStyle="#ff3933";

  ctx.fillText(
    "INVADERS",
    W/2,
    H*.40
  );


  ctx.fillStyle="#fff";
  ctx.font="16px Arial";

  ctx.fillText(
    "CYBER RAPTOR ONLINE",
    W/2,
    H*.49
  );


  ctx.font="bold 21px Arial";

  ctx.fillText(
    "TAP TO START",
    W/2,
    H*.59
  );
}


// ===============================
// GAME OVER
// ===============================

function drawDead(){

  ctx.fillStyle="rgba(12,28,24,.70)";

  ctx.fillRect(
    25,
    H*.32,
    W-50,
    210
  );


  ctx.textAlign="center";


  ctx.fillStyle="#ff3933";
  ctx.font="bold 31px Arial";

  ctx.fillText(
    "SYSTEM DOWN",
    W/2,
    H*.41
  );


  ctx.fillStyle="#fff";
  ctx.font="21px Arial";

  ctx.fillText(
    "Score: "+score,
    W/2,
    H*.48
  );


  ctx.font="bold 20px Arial";

  ctx.fillText(
    "TAP TO REBOOT",
    W/2,
    H*.57
  );
}


// ===============================
// DRAW
// ===============================

function draw(){

  drawBackground();

  for(const r of ruins){
    drawRuin(r);
  }

  drawBullets();

  for(const e of enemies){
    drawEnemy(e);
  }

  drawParticles();
  drawPlayer();
  drawHUD();


  if(state==="start"){
    drawStart();
  }

  if(state==="dead"){
    drawDead();
  }
}


// ===============================
// LOOP
// ===============================

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}


canvas.addEventListener(
  "pointerdown",
  function(e){
    e.preventDefault();
    tap();
  }
);

loop();

</script>
</body>
</html>
