<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dino Invaders</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070b0d;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);

// ---------- ART ----------

const raptorImg=new Image();
raptorImg.src="8BBBE99D-BE50-463D-AB99-9356374B034D.png";

const enemyImg=new Image();
enemyImg.src="223E8F5F-AC53-4AC9-9DAE-CCF47D50F608.png";

// ---------- GAME ----------

let state="start";
let score=0;
let high=Number(localStorage.dinoHigh||0);
let frame=0;
let flash=0;
let recoil=0;

const dino={
  x:82,
  y:250,
  vy:0,
  r:17
};

let bullets=[];
let enemies=[];
let obstacles=[];
let particles=[];
let trails=[];

function reset(){
  score=0;
  frame=0;
  flash=0;
  recoil=0;

  dino.y=H*.45;
  dino.vy=0;

  bullets=[];
  enemies=[];
  obstacles=[];
  particles=[];
  trails=[];
}

function start(){
  reset();
  state="play";
}

function flap(){

  if(state==="start" || state==="dead"){
    start();
    return;
  }

  dino.vy=-7.2;

  for(let i=0;i<5;i++){
    trails.push({
      x:dino.x-45,
      y:dino.y+10,
      vx:-2-Math.random()*3,
      vy:(Math.random()-.5)*2,
      life:18+Math.random()*8,
      size:3+Math.random()*5
    });
  }

  shoot();
}

function shoot(){

  bullets.push({
    x:dino.x+55,
    y:dino.y-5,
    vx:10,
    r:5
  });

  recoil=7;
  flash=3;

  for(let i=0;i<5;i++){
    particles.push({
      x:dino.x+54,
      y:dino.y-5,
      vx:2+Math.random()*4,
      vy:(Math.random()-.5)*3,
      life:15,
      type:"red"
    });
  }
}

// ---------- ENEMIES ----------

function spawnEnemy(){

  enemies.push({
    x:W+80,
    baseY:80+Math.random()*(H-190),
    y:0,
    vx:2.7+Math.random()*1.3,
    r:20,
    phase:Math.random()*Math.PI*2,
    bob:10+Math.random()*13
  });

}

function spawnObstacle(){

  const gap=180;
  const top=70+Math.random()*(H-gap-180);

  obstacles.push({
    x:W+40,
    w:55,
    top,
    bottom:top+gap,
    passed:false
  });
}

function hitCircle(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;
  const r=a.r+b.r;

  return dx*dx+dy*dy<r*r;
}

function explode(x,y,type="orange"){

  for(let i=0;i<20;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,
      life:25+Math.random()*18,
      size:3+Math.random()*5,
      type
    });

  }
}

function die(){

  if(state!=="play") return;

  state="dead";

  if(score>high){
    high=score;
    localStorage.dinoHigh=high;
  }

  explode(dino.x,dino.y,"red");
}

// ---------- UPDATE ----------

function update(){

  if(recoil>0) recoil*=.72;
  if(flash>0) flash--;

  trails.forEach(t=>{
    t.x+=t.vx;
    t.y+=t.vy;
    t.life--;
  });

  trails=trails.filter(t=>t.life>0);

  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  });

  particles=particles.filter(p=>p.life>0);

  if(state!=="play") return;

  frame++;

  dino.vy+=.38;
  dino.y+=dino.vy;

  if(frame%3===0){

    trails.push({
      x:dino.x-43,
      y:dino.y+10,
      vx:-2-Math.random()*2,
      vy:(Math.random()-.5),
      life:15,
      size:2+Math.random()*3
    });

  }

  if(dino.y<20 || dino.y>H-35){
    die();
  }

  if(frame%105===0){
    spawnObstacle();
  }

  if(frame%135===0){
    spawnEnemy();
  }

  bullets.forEach(b=>{
    b.x+=b.vx;
  });

  bullets=bullets.filter(b=>b.x<W+30);

  // Flying enemies bob up and down
  enemies.forEach(e=>{

    e.x-=e.vx;

    e.y=
      e.baseY+
      Math.sin(frame*.055+e.phase)*e.bob;

  });

  obstacles.forEach(o=>{

    o.x-=2.8;

    if(!o.passed && o.x+o.w<dino.x){

      o.passed=true;
      score++;

    }

    if(
      dino.x+dino.r>o.x &&
      dino.x-dino.r<o.x+o.w &&
      (
        dino.y-dino.r<o.top ||
        dino.y+dino.r>o.bottom
      )
    ){
      die();
    }

  });

  obstacles=obstacles.filter(o=>o.x>-80);

  // Enemy collisions
  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(hitCircle(dino,e)){
      die();
    }

    for(let j=bullets.length-1;j>=0;j--){

      const b=bullets[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;

      if(
        dx*dx+dy*dy <
        (e.r+b.r)*(e.r+b.r)
      ){

        // Orange enemy destruction
        explode(e.x,e.y,"orange");

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=2;

        break;
      }
    }
  }

  enemies=enemies.filter(e=>e.x>-100);
}

// ---------- BACKGROUND ----------

function background(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#071018");
  g.addColorStop(.55,"#182d2c");
  g.addColorStop(1,"#131b15");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // Moon
  ctx.fillStyle="rgba(230,240,255,.12)";
  ctx.beginPath();
  ctx.arc(W*.78,H*.18,65,0,Math.PI*2);
  ctx.fill();

  // Distant mountains
  ctx.fillStyle="#101c1b";

  for(let i=-50;i<W+100;i+=100){

    const h=80+((i*7)%70);

    ctx.beginPath();
    ctx.moveTo(i,H);
    ctx.lineTo(i+50,H-h);
    ctx.lineTo(i+100,H);
    ctx.fill();

  }

  ctx.fillStyle="#08130c";
  ctx.fillRect(0,H-30,W,30);
}

// ---------- CYBER RAPTOR ----------

function drawRaptor(){

  ctx.save();

  ctx.translate(
    dino.x-recoil,
    dino.y
  );

  const angle=
    Math.max(
      -.18,
      Math.min(.22,dino.vy*.025)
    );

  ctx.rotate(angle);

  // Red jet glow
  const glow=
    ctx.createRadialGradient(
      -42,8,2,
      -42,8,42
    );

  glow.addColorStop(
    0,
    "rgba(255,60,25,.8)"
  );

  glow.addColorStop(
    1,
    "rgba(255,20,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.beginPath();
  ctx.arc(-42,8,42,0,Math.PI*2);
  ctx.fill();

  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const drawW=155;

    const ratio=
      raptorImg.naturalHeight/
      raptorImg.naturalWidth;

    const drawH=drawW*ratio;

    ctx.drawImage(
      raptorImg,
      -drawW*.47,
      -drawH*.50,
      drawW,
      drawH
    );

  }

  ctx.restore();
}

// ---------- ORANGE RAPTOR DRONE ----------

function drawEnemy(e){

  ctx.save();

  ctx.translate(e.x,e.y);

  // Enemy faces LEFT toward player
  ctx.scale(-1,1);

  // Orange energy aura
  const glow=
    ctx.createRadialGradient(
      0,0,5,
      0,0,48
    );

  glow.addColorStop(
    0,
    "rgba(255,145,0,.20)"
  );

  glow.addColorStop(
    1,
    "rgba(255,100,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.beginPath();
  ctx.arc(0,0,48,0,Math.PI*2);
  ctx.fill();

  if(
    enemyImg.complete &&
    enemyImg.naturalWidth
  ){

    const drawW=100;

    const ratio=
      enemyImg.naturalHeight/
      enemyImg.naturalWidth;

    const drawH=drawW*ratio;

    ctx.drawImage(
      enemyImg,
      -drawW*.50,
      -drawH*.50,
      drawW,
      drawH
    );

  }else{

    // Backup while image loads
    ctx.fillStyle="#ff9500";

    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2);
    ctx.fill();

  }

  ctx.restore();
}

// ---------- DRAW ----------

function draw(){

  background();

  // Cyber Raptor engine trails
  trails.forEach(t=>{

    ctx.globalAlpha=
      Math.max(0,t.life/25);

    ctx.fillStyle="#ff4b20";

    ctx.beginPath();
    ctx.arc(
      t.x,
      t.y,
      t.size,
      0,
      Math.PI*2
    );
    ctx.fill();

  });

  ctx.globalAlpha=1;

  // Temporary obstacles
  obstacles.forEach(o=>{

    ctx.fillStyle="#334c35";

    ctx.fillRect(
      o.x,
      0,
      o.w,
      o.top
    );

    ctx.fillRect(
      o.x,
      o.bottom,
      o.w,
      H-o.bottom
    );

    ctx.fillStyle="#4e6c49";

    ctx.fillRect(
      o.x-5,
      o.top-18,
      o.w+10,
      18
    );

    ctx.fillRect(
      o.x-5,
      o.bottom,
      o.w+10,
      18
    );

  });

  // Red plasma
  bullets.forEach(b=>{

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff2020";

    ctx.fillStyle="#fff3df";

    ctx.beginPath();
    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#ff3025";

    ctx.beginPath();

    ctx.ellipse(
      b.x-9,
      b.y,
      13,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });

  enemies.forEach(drawEnemy);

  // Explosion particles
  particles.forEach(p=>{

    ctx.globalAlpha=
      Math.max(0,p.life/35);

    if(p.type==="orange"){
      ctx.fillStyle="#ff9d19";
    }else{
      ctx.fillStyle="#ff352e";
    }

    ctx.shadowBlur=10;
    ctx.shadowColor=ctx.fillStyle;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size||4,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });

  ctx.globalAlpha=1;

  drawRaptor();

  // ---------- HUD ----------

  ctx.textAlign="center";

  ctx.fillStyle="#fff";
  ctx.font="bold 30px Arial";

  ctx.fillText(
    score,
    W/2,
    55
  );

  ctx.font="15px Arial";

  ctx.fillText(
    "BEST "+high,
    W/2,
    78
  );

  if(state==="start"){

    ctx.fillStyle=
      "rgba(0,0,0,.58)";

    ctx.fillRect(
      20,
      H*.24,
      W-40,
      275
    );

    ctx.fillStyle="#fff";
    ctx.font="bold 38px Arial";

    ctx.fillText(
      "DINO",
      W/2,
      H*.33
    );

    ctx.fillStyle="#ff3030";

    ctx.fillText(
      "INVADERS",
      W/2,
      H*.39
    );

    ctx.fillStyle="#fff";
    ctx.font="20px Arial";

    ctx.fillText(
      "CYBER RAPTOR ONLINE",
      W/2,
      H*.48
    );

    ctx.font="15px Arial";

    ctx.fillText(
      "Destroy the invasion",
      W/2,
      H*.53
    );

    ctx.font="bold 22px Arial";

    ctx.fillText(
      "TAP TO START",
      W/2,
      H*.63
    );

  }

  if(state==="dead"){

    ctx.fillStyle=
      "rgba(0,0,0,.65)";

    ctx.fillRect(
      25,
      H*.31,
      W-50,
      220
    );

    ctx.fillStyle="#ff3636";
    ctx.font="bold 34px Arial";

    ctx.fillText(
      "SYSTEM DOWN",
      W/2,
      H*.40
    );

    ctx.fillStyle="#fff";
    ctx.font="22px Arial";

    ctx.fillText(
      "Score: "+score,
      W/2,
      H*.47
    );

    ctx.font="bold 20px Arial";

    ctx.fillText(
      "TAP TO REBOOT",
      W/2,
      H*.56
    );

  }

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,30,20,.08)";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }
}

// ---------- LOOP ----------

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

canvas.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();
    flap();

  }
);

loop();
</script>
</body>
</html>
