<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Invaders V5.1</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#7997a1;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);


// ===============================
// IMAGES
// ===============================

const raptorImg=new Image();
raptorImg.src=
"8BBBE99D-BE50-463D-AB99-9356374B034D.png";

const enemyImg=new Image();
enemyImg.src=
"223E8F5F-AC53-4AC9-9DAE-CCF47D50F608.png";

const ruinImg=new Image();
ruinImg.src=
"067A72EE-0208-4233-A0A7-EDC71FB6F263.png";


// ===============================
// GAME STATE
// ===============================

let state="start";
let score=0;
let high=Number(localStorage.dinoHigh||0);

let frame=0;
let worldX=0;
let recoil=0;

const player={
  x:82,
  y:250,
  vy:0,
  r:17
};

let bullets=[];
let enemies=[];
let ruins=[];
let particles=[];


// ===============================
// START / RESET
// ===============================

function reset(){

  score=0;
  frame=0;
  worldX=0;
  recoil=0;

  player.y=H*.45;
  player.vy=0;

  bullets=[];
  enemies=[];
  ruins=[];
  particles=[];
}

function start(){

  reset();
  state="play";

}


// ===============================
// PLAYER
// ===============================

function tap(){

  if(state==="start" || state==="dead"){
    start();
    return;
  }

  player.vy=-7.1;

  shoot();

  // small engine burst

  for(let i=0;i<4;i++){

    particles.push({

      x:player.x-35,
      y:player.y+8,

      vx:-2-Math.random()*2,
      vy:(Math.random()-.5)*2,

      life:15,
      size:2+Math.random()*3,
      type:"red"

    });

  }

}


function shoot(){

  bullets.push({

    x:player.x+48,
    y:player.y-4,

    vx:10,
    r:5

  });

  recoil=6;

}


// ===============================
// SPAWN RUINS
// ===============================

function spawnRuin(){

  const gap=195;

  const minCenter=150;
  const maxCenter=H-150;

  let center;

  if(maxCenter>minCenter){

    center=
      minCenter+
      Math.random()*
      (maxCenter-minCenter);

  }else{

    center=H*.5;

  }

  ruins.push({

    x:W+100,

    w:105,

    top:center-gap/2,

    bottom:center+gap/2,

    passed:false

  });

}


// ===============================
// SPAWN ENEMIES
// ===============================

function spawnEnemy(){

  enemies.push({

    x:W+80,

    baseY:
      100+
      Math.random()*
      Math.max(60,H-220),

    y:H*.5,

    vx:
      2.6+
      Math.random(),

    r:20,

    phase:
      Math.random()*
      Math.PI*2

  });

}


// ===============================
// PARTICLES
// ===============================

function explode(x,y,type){

  for(let i=0;i<14;i++){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        20+
        Math.random()*12,

      size:
        2+
        Math.random()*4,

      type:type

    });

  }

}


// ===============================
// COLLISION
// ===============================

function circleHit(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  const rr=a.r+b.r;

  return(
    dx*dx+
    dy*dy<
    rr*rr
  );

}


function die(){

  if(state!=="play") return;

  state="dead";

  explode(
    player.x,
    player.y,
    "red"
  );

  if(score>high){

    high=score;
    localStorage.dinoHigh=high;

  }

}


// ===============================
// UPDATE
// ===============================

function update(){

  if(recoil>0){
    recoil*=.7;
  }


  // particles

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }

  }


  if(state!=="play"){
    return;
  }


  frame++;
  worldX+=2.65;


  // player physics

  player.vy+=.38;
  player.y+=player.vy;


  if(
    player.y<20 ||
    player.y>H-35
  ){

    die();

  }


  // spawning

  if(frame%118===0){
    spawnRuin();
  }

  if(frame%155===0){
    spawnEnemy();
  }


  // bullets

  for(let i=bullets.length-1;i>=0;i--){

    bullets[i].x+=
      bullets[i].vx;

    if(bullets[i].x>W+40){
      bullets.splice(i,1);
    }

  }


  // ruins

  for(let i=ruins.length-1;i>=0;i--){

    const r=ruins[i];

    r.x-=2.65;


    if(
      !r.passed &&
      r.x+r.w<player.x
    ){

      r.passed=true;
      score++;

    }


    if(

      player.x+player.r>r.x &&

      player.x-player.r<
      r.x+r.w &&

      (

        player.y-player.r<
        r.top ||

        player.y+player.r>
        r.bottom

      )

    ){

      die();

    }


    if(r.x<-150){
      ruins.splice(i,1);
    }

  }


  // enemies

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    e.x-=e.vx;

    e.y=
      e.baseY+
      Math.sin(
        frame*.05+
        e.phase
      )*12;


    if(circleHit(player,e)){
      die();
    }


    for(let j=bullets.length-1;j>=0;j--){

      const b=bullets[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;

      const rr=b.r+e.r;


      if(
        dx*dx+
        dy*dy<
        rr*rr
      ){

        explode(
          e.x,
          e.y,
          "orange"
        );

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=2;

        break;

      }

    }


    if(
      enemies[i] &&
      enemies[i].x<-120
    ){

      enemies.splice(i,1);

    }

  }

}


// ===============================
// LIGHTWEIGHT BACKGROUND
// ===============================

function drawBackground(){

  // sky

  const sky=
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  sky.addColorStop(
    0,
    "#789cad"
  );

  sky.addColorStop(
    .48,
    "#aab8ad"
  );

  sky.addColorStop(
    1,
    "#778461"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );


  // warm horizon glow

  const sun=
    ctx.createRadialGradient(
      W*.18,
      H*.24,
      10,
      W*.18,
      H*.24,
      130
    );

  sun.addColorStop(
    0,
    "rgba(255,226,165,.45)"
  );

  sun.addColorStop(
    1,
    "rgba(255,226,165,0)"
  );

  ctx.fillStyle=sun;

  ctx.fillRect(
    0,0,W,H*.55
  );


  // =====================
  // FAR MOUNTAINS
  // =====================

  const farOffset=
    -(worldX*.10)%240;

  ctx.fillStyle=
    "rgba(69,88,82,.55)";


  for(
    let x=farOffset-240;
    x<W+240;
    x+=240
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      H*.72
    );

    ctx.lineTo(
      x+120,
      H*.37
    );

    ctx.lineTo(
      x+240,
      H*.72
    );

    ctx.closePath();
    ctx.fill();

  }


  // atmospheric mist

  ctx.fillStyle=
    "rgba(220,230,218,.14)";

  ctx.fillRect(
    0,
    H*.54,
    W,
    H*.18
  );


  // =====================
  // NEAR JUNGLE HILLS
  // =====================

  const nearOffset=
    -(worldX*.30)%150;

  ctx.fillStyle="#48634c";


  for(
    let x=nearOffset-150;
    x<W+150;
    x+=150
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      H
    );

    ctx.lineTo(
      x+35,
      H*.74
    );

    ctx.lineTo(
      x+80,
      H*.67
    );

    ctx.lineTo(
      x+120,
      H*.76
    );

    ctx.lineTo(
      x+150,
      H
    );

    ctx.closePath();

    ctx.fill();

  }


  // ground silhouette

  ctx.fillStyle="#1d3829";

  ctx.fillRect(
    0,
    H-24,
    W,
    24
  );

}


// ===============================
// RUIN ART
// ===============================

function drawRuin(r){

  if(
    !ruinImg.complete ||
    !ruinImg.naturalWidth
  ){

    // only visible if asset fails

    ctx.fillStyle="#66725a";

    ctx.fillRect(
      r.x,
      0,
      r.w,
      r.top
    );

    ctx.fillRect(
      r.x,
      r.bottom,
      r.w,
      H-r.bottom
    );

    return;

  }


  const iw=
    ruinImg.naturalWidth;

  const ih=
    ruinImg.naturalHeight;


  /*
    The new artwork is designed
    as one upper ruin and one
    lower ruin.

    Use separate source regions
    with extra empty center space
    excluded from both crops.
  */

  const topSourceH=
    ih*.46;

  const bottomSourceY=
    ih*.50;

  const bottomSourceH=
    ih*.50;


  // =====================
  // TOP RUIN
  // =====================

  const topH=
    Math.max(
      150,
      r.top+50
    );

  const topW=150;


  ctx.drawImage(

    ruinImg,

    0,
    0,
    iw,
    topSourceH,

    r.x-
    (topW-r.w)/2,

    r.top-topH+25,

    topW,
    topH

  );


  // =====================
  // BOTTOM RUIN
  // =====================

  const bottomH=
    Math.max(
      170,
      H-r.bottom+40
    );

  const bottomW=160;


  ctx.drawImage(

    ruinImg,

    0,
    bottomSourceY,
    iw,
    bottomSourceH,

    r.x-
    (bottomW-r.w)/2,

    r.bottom-18,

    bottomW,
    bottomH

  );

}


// ===============================
// PLAYER ART
// ===============================

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x-recoil,
    player.y
  );


  const angle=
    Math.max(
      -.17,
      Math.min(
        .20,
        player.vy*.023
      )
    );

  ctx.rotate(angle);


  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const w=155;

    const h=
      w*
      raptorImg.naturalHeight/
      raptorImg.naturalWidth;


    ctx.drawImage(
      raptorImg,
      -w*.47,
      -h*.5,
      w,
      h
    );

  }


  ctx.restore();

}


// ===============================
// ENEMY ART
// ===============================

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    e.x,
    e.y
  );


  // face toward player

  ctx.scale(-1,1);


  if(
    enemyImg.complete &&
    enemyImg.naturalWidth
  ){

    const w=100;

    const h=
      w*
      enemyImg.naturalHeight/
      enemyImg.naturalWidth;


    ctx.drawImage(
      enemyImg,
      -w/2,
      -h/2,
      w,
      h
    );

  }else{

    ctx.fillStyle="#ff8c22";

    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2);
    ctx.fill();

  }


  ctx.restore();

}


// ===============================
// DRAW
// ===============================

function draw(){

  drawBackground();


  // ruins

  for(const r of ruins){
    drawRuin(r);
  }


  // bullets

  for(const b of bullets){

    ctx.fillStyle="#ff352d";

    ctx.beginPath();

    ctx.ellipse(
      b.x,
      b.y,
      13,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      b.x+4,
      b.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  // enemies

  for(const e of enemies){
    drawEnemy(e);
  }


  // particles

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/30
      );


    ctx.fillStyle=
      p.type==="orange"
      ? "#ff9c22"
      : "#ff3a32";


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;


  drawPlayer();


  // =====================
  // HUD
  // =====================

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.shadowColor=
    "rgba(0,0,0,.55)";

  ctx.shadowBlur=4;

  ctx.font=
    "bold 30px Arial";

  ctx.fillText(
    score,
    W/2,
    55
  );


  ctx.font=
    "15px Arial";

  ctx.fillText(
    "BEST "+high,
    W/2,
    78
  );


  ctx.shadowBlur=0;


  // =====================
  // START SCREEN
  // =====================

  if(state==="start"){

    ctx.fillStyle=
      "rgba(18,29,25,.66)";

    ctx.fillRect(
      20,
      H*.25,
      W-40,
      265
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "bold 38px Arial";

    ctx.fillText(
      "DINO",
      W/2,
      H*.34
    );


    ctx.fillStyle="#ff3732";

    ctx.fillText(
      "INVADERS",
      W/2,
      H*.40
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "18px Arial";

    ctx.fillText(
      "CYBER RAPTOR ONLINE",
      W/2,
      H*.49
    );


    ctx.font=
      "bold 21px Arial";

    ctx.fillText(
      "TAP TO START",
      W/2,
      H*.59
    );

  }


  // =====================
  // GAME OVER
  // =====================

  if(state==="dead"){

    ctx.fillStyle=
      "rgba(18,29,25,.72)";

    ctx.fillRect(
      25,
      H*.32,
      W-50,
      210
    );


    ctx.fillStyle="#ff3732";

    ctx.font=
      "bold 32px Arial";

    ctx.fillText(
      "SYSTEM DOWN",
      W/2,
      H*.41
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "21px Arial";

    ctx.fillText(
      "Score: "+score,
      W/2,
      H*.48
    );


    ctx.font=
      "bold 20px Arial";

    ctx.fillText(
      "TAP TO REBOOT",
      W/2,
      H*.57
    );

  }

}


// ===============================
// LOOP
// ===============================

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);

}


canvas.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();
    tap();

  }
);


loop();

</script>
</body>
</html>
