<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dino Invaders</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#88a6ac;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);


// =====================================
// ART
// =====================================

const raptorImg=new Image();
raptorImg.src="8BBBE99D-BE50-463D-AB99-9356374B034D.png";

const enemyImg=new Image();
enemyImg.src="223E8F5F-AC53-4AC9-9DAE-CCF47D50F608.png";

const ruinImg=new Image();
ruinImg.src="5080889A-A0A6-480F-9940-CAE4F6A11FBF.png";


// =====================================
// GAME STATE
// =====================================

let state="start";
let score=0;
let high=Number(localStorage.dinoHigh||0);
let frame=0;
let worldX=0;
let flash=0;
let recoil=0;

const dino={
  x:82,
  y:250,
  vy:0,
  r:17
};

let bullets=[];
let enemies=[];
let obstacles=[];
let particles=[];
let trails=[];


// =====================================
// RESET
// =====================================

function reset(){

  score=0;
  frame=0;
  worldX=0;
  flash=0;
  recoil=0;

  dino.y=H*.45;
  dino.vy=0;

  bullets=[];
  enemies=[];
  obstacles=[];
  particles=[];
  trails=[];
}

function start(){
  reset();
  state="play";
}


// =====================================
// PLAYER
// =====================================

function flap(){

  if(state==="start" || state==="dead"){
    start();
    return;
  }

  dino.vy=-7.2;

  for(let i=0;i<6;i++){

    trails.push({
      x:dino.x-45,
      y:dino.y+10,
      vx:-2-Math.random()*3,
      vy:(Math.random()-.5)*2,
      life:20+Math.random()*8,
      size:3+Math.random()*5
    });

  }

  shoot();
}

function shoot(){

  bullets.push({
    x:dino.x+55,
    y:dino.y-5,
    vx:10,
    r:5
  });

  recoil=7;
  flash=3;

  for(let i=0;i<5;i++){

    particles.push({
      x:dino.x+54,
      y:dino.y-5,
      vx:2+Math.random()*4,
      vy:(Math.random()-.5)*3,
      life:15,
      size:3,
      type:"red"
    });

  }
}


// =====================================
// SPAWNING
// =====================================

function spawnEnemy(){

  enemies.push({

    x:W+80,

    baseY:
      85+
      Math.random()*
      Math.max(80,H-210),

    y:0,

    vx:
      2.7+
      Math.random()*1.3,

    r:20,

    phase:
      Math.random()*
      Math.PI*2,

    bob:
      10+
      Math.random()*13
  });

}

function spawnObstacle(){

  const gap=190;

  const margin=85;

  const minCenter=
    margin+
    gap/2;

  const maxCenter=
    H-
    margin-
    gap/2;

  const center=
    minCenter+
    Math.random()*
    Math.max(
      1,
      maxCenter-minCenter
    );

  obstacles.push({

    x:W+90,

    w:92,

    top:center-gap/2,

    bottom:center+gap/2,

    passed:false
  });

}


// =====================================
// COLLISIONS
// =====================================

function hitCircle(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;
  const r=a.r+b.r;

  return(
    dx*dx+
    dy*dy<
    r*r
  );
}

function explode(x,y,type="orange"){

  for(let i=0;i<20;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*8,

      vy:
        (Math.random()-.5)*8,

      life:
        25+
        Math.random()*18,

      size:
        3+
        Math.random()*5,

      type
    });

  }
}

function die(){

  if(state!=="play") return;

  state="dead";

  if(score>high){

    high=score;
    localStorage.dinoHigh=high;

  }

  explode(
    dino.x,
    dino.y,
    "red"
  );
}


// =====================================
// UPDATE
// =====================================

function update(){

  if(recoil>0){
    recoil*=.72;
  }

  if(flash>0){
    flash--;
  }

  trails.forEach(t=>{

    t.x+=t.vx;
    t.y+=t.vy;
    t.life--;

  });

  trails=
    trails.filter(
      t=>t.life>0
    );

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

  });

  particles=
    particles.filter(
      p=>p.life>0
    );

  if(state!=="play") return;

  frame++;
  worldX+=2.8;

  dino.vy+=.38;
  dino.y+=dino.vy;


  // engine trail

  if(frame%3===0){

    trails.push({

      x:dino.x-43,
      y:dino.y+10,

      vx:
        -2-
        Math.random()*2,

      vy:
        (Math.random()-.5),

      life:15,

      size:
        2+
        Math.random()*3

    });

  }


  if(
    dino.y<20 ||
    dino.y>H-35
  ){
    die();
  }


  // Ruins

  if(frame%110===0){
    spawnObstacle();
  }


  // Enemy drones

  if(frame%138===0){
    spawnEnemy();
  }


  // Plasma

  bullets.forEach(
    b=>b.x+=b.vx
  );

  bullets=
    bullets.filter(
      b=>b.x<W+40
    );


  // Enemy movement

  enemies.forEach(e=>{

    e.x-=e.vx;

    e.y=
      e.baseY+
      Math.sin(
        frame*.055+
        e.phase
      )*
      e.bob;

  });


  // Ruin movement + collision

  obstacles.forEach(o=>{

    o.x-=2.8;


    if(
      !o.passed &&
      o.x+o.w<dino.x
    ){

      o.passed=true;
      score++;

    }


    if(

      dino.x+dino.r>o.x &&

      dino.x-dino.r<
      o.x+o.w &&

      (

        dino.y-dino.r<
        o.top ||

        dino.y+dino.r>
        o.bottom

      )

    ){

      die();

    }

  });


  obstacles=
    obstacles.filter(
      o=>o.x>-130
    );


  // Enemy collision

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];


    if(hitCircle(dino,e)){
      die();
    }


    for(
      let j=bullets.length-1;
      j>=0;
      j--
    ){

      const b=bullets[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;

      if(

        dx*dx+
        dy*dy<

        (e.r+b.r)*
        (e.r+b.r)

      ){

        explode(
          e.x,
          e.y,
          "orange"
        );

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=2;

        break;
      }

    }

  }


  enemies=
    enemies.filter(
      e=>e.x>-120
    );
}


// =====================================
// V5 PARALLAX WORLD
// =====================================

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  // Warm daylight,
  // but not excessively bright.

  g.addColorStop(
    0,
    "#6f95aa"
  );

  g.addColorStop(
    .42,
    "#9eb5b2"
  );

  g.addColorStop(
    .72,
    "#c5a879"
  );

  g.addColorStop(
    1,
    "#526f55"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );


  // Warm sun glow

  const sunX=W*.18;
  const sunY=H*.20;

  const sun=
    ctx.createRadialGradient(
      sunX,
      sunY,
      5,
      sunX,
      sunY,
      130
    );

  sun.addColorStop(
    0,
    "rgba(255,235,180,.55)"
  );

  sun.addColorStop(
    1,
    "rgba(255,220,150,0)"
  );

  ctx.fillStyle=sun;

  ctx.beginPath();

  ctx.arc(
    sunX,
    sunY,
    130,
    0,
    Math.PI*2
  );

  ctx.fill();

}


// =====================================
// DISTANT MOUNTAINS
// =====================================

function drawMountains(){

  const offset=
    -(worldX*.12)%220;

  ctx.fillStyle=
    "rgba(58,82,77,.50)";

  for(
    let x=offset-220;
    x<W+220;
    x+=220
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      H*.72
    );

    ctx.lineTo(
      x+110,
      H*.31
    );

    ctx.lineTo(
      x+220,
      H*.72
    );

    ctx.closePath();
    ctx.fill();

  }


  // Mist layer

  ctx.fillStyle=
    "rgba(225,235,220,.16)";

  ctx.fillRect(
    0,
    H*.57,
    W,
    H*.18
  );

}


// =====================================
// MIDGROUND CLIFFS
// =====================================

function drawCliffs(){

  const offset=
    -(worldX*.32)%180;

  ctx.fillStyle=
    "#3c5945";

  for(
    let x=offset-180;
    x<W+180;
    x+=180
  ){

    const peak=
      60+
      ((Math.abs(x)*7)%80);

    ctx.beginPath();

    ctx.moveTo(
      x,
      H
    );

    ctx.lineTo(
      x+40,
      H-peak
    );

    ctx.lineTo(
      x+95,
      H-peak-35
    );

    ctx.lineTo(
      x+140,
      H-peak+20
    );

    ctx.lineTo(
      x+180,
      H
    );

    ctx.closePath();

    ctx.fill();

  }

}


// =====================================
// WATERFALLS
// =====================================

function drawWaterfalls(){

  const offset=
    -(worldX*.32)%360;

  for(
    let x=offset;
    x<W+360;
    x+=360
  ){

    const wx=x+115;

    const grad=
      ctx.createLinearGradient(
        wx,
        H*.58,
        wx,
        H
      );

    grad.addColorStop(
      0,
      "rgba(190,225,225,.55)"
    );

    grad.addColorStop(
      1,
      "rgba(190,225,225,0)"
    );

    ctx.fillStyle=grad;

    ctx.fillRect(
      wx,
      H*.58,
      18,
      H*.34
    );

  }

}


// =====================================
// FOREGROUND JUNGLE
// =====================================

function drawJungle(){

  const offset=
    -(worldX*.72)%80;

  ctx.fillStyle=
    "#183a29";

  for(
    let x=offset-80;
    x<W+80;
    x+=80
  ){

    ctx.beginPath();

    ctx.arc(
      x,
      H-22,
      52,
      Math.PI,
      0
    );

    ctx.fill();

  }


  ctx.fillStyle=
    "#102a20";

  ctx.fillRect(
    0,
    H-25,
    W,
    25
  );

}


// =====================================
// RUIN OBSTACLE
// =====================================

function drawRuin(o){

  if(
    !ruinImg.complete ||
    !ruinImg.naturalWidth
  ){

    // Temporary backup
    ctx.fillStyle="#6d765b";

    ctx.fillRect(
      o.x,
      0,
      o.w,
      o.top
    );

    ctx.fillRect(
      o.x,
      o.bottom,
      o.w,
      H-o.bottom
    );

    return;
  }


  /*
    Our ruin image contains
    a TOP ruin and BOTTOM ruin.

    We crop the image into
    two halves and position
    them around the gameplay gap.
  */

  const iw=
    ruinImg.naturalWidth;

  const ih=
    ruinImg.naturalHeight;

  const half=
    ih/2;


  // ---------- TOP RUIN ----------

  const topHeight=
    Math.max(
      120,
      o.top+65
    );

  ctx.drawImage(

    ruinImg,

    0,
    0,
    iw,
    half,

    o.x-32,
    o.top-topHeight+30,

    o.w+64,
    topHeight

  );


  // ---------- BOTTOM RUIN ----------

  const bottomHeight=
    Math.max(
      150,
      H-o.bottom+80
    );

  ctx.drawImage(

    ruinImg,

    0,
    half,
    iw,
    half,

    o.x-34,
    o.bottom-25,

    o.w+68,
    bottomHeight

  );


  // Blue alien glow at edges

  ctx.shadowBlur=15;
  ctx.shadowColor="#45d9ff";

  ctx.fillStyle=
    "rgba(70,220,255,.25)";

  ctx.fillRect(
    o.x+o.w*.45,
    o.top-3,
    4,
    12
  );

  ctx.fillRect(
    o.x+o.w*.45,
    o.bottom-9,
    4,
    12
  );

  ctx.shadowBlur=0;

}


// =====================================
// CYBER RAPTOR
// =====================================

function drawRaptor(){

  ctx.save();

  ctx.translate(
    dino.x-recoil,
    dino.y
  );

  const angle=
    Math.max(
      -.18,
      Math.min(
        .22,
        dino.vy*.025
      )
    );

  ctx.rotate(angle);


  // Red engine glow

  const glow=
    ctx.createRadialGradient(
      -42,8,2,
      -42,8,42
    );

  glow.addColorStop(
    0,
    "rgba(255,60,25,.8)"
  );

  glow.addColorStop(
    1,
    "rgba(255,20,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.beginPath();

  ctx.arc(
    -42,
    8,
    42,
    0,
    Math.PI*2
  );

  ctx.fill();


  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const drawW=155;

    const ratio=
      raptorImg.naturalHeight/
      raptorImg.naturalWidth;

    const drawH=
      drawW*ratio;

    ctx.drawImage(
      raptorImg,
      -drawW*.47,
      -drawH*.50,
      drawW,
      drawH
    );

  }

  ctx.restore();
}


// =====================================
// ORANGE ENEMY
// =====================================

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    e.x,
    e.y
  );

  ctx.scale(-1,1);


  const glow=
    ctx.createRadialGradient(
      0,0,5,
      0,0,48
    );

  glow.addColorStop(
    0,
    "rgba(255,145,0,.20)"
  );

  glow.addColorStop(
    1,
    "rgba(255,100,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    48,
    0,
    Math.PI*2
  );

  ctx.fill();


  if(
    enemyImg.complete &&
    enemyImg.naturalWidth
  ){

    const drawW=100;

    const ratio=
      enemyImg.naturalHeight/
      enemyImg.naturalWidth;

    const drawH=
      drawW*ratio;

    ctx.drawImage(
      enemyImg,
      -drawW*.50,
      -drawH*.50,
      drawW,
      drawH
    );

  }

  ctx.restore();
}


// =====================================
// MAIN DRAW
// =====================================

function draw(){

  drawSky();
  drawMountains();
  drawCliffs();
  drawWaterfalls();


  // Engine trails

  trails.forEach(t=>{

    ctx.globalAlpha=
      Math.max(
        0,
        t.life/25
      );

    ctx.fillStyle=
      "#ff4b20";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      t.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.globalAlpha=1;


  // Ruins replace pipes

  obstacles.forEach(
    drawRuin
  );


  // Plasma

  bullets.forEach(b=>{

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff2020";

    ctx.fillStyle="#fff3df";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ff3025";

    ctx.beginPath();

    ctx.ellipse(
      b.x-9,
      b.y,
      13,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });


  enemies.forEach(
    drawEnemy
  );


  // Explosion particles

  particles.forEach(p=>{

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/35
      );

    ctx.fillStyle=
      p.type==="orange"
      ? "#ff9d19"
      : "#ff352e";

    ctx.shadowBlur=10;
    ctx.shadowColor=
      ctx.fillStyle;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size||4,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });

  ctx.globalAlpha=1;


  drawRaptor();

  drawJungle();


  // =================================
  // HUD
  // =================================

  ctx.textAlign="center";

  ctx.shadowBlur=5;
  ctx.shadowColor=
    "rgba(0,0,0,.6)";

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 30px Arial";

  ctx.fillText(
    score,
    W/2,
    55
  );

  ctx.font=
    "15px Arial";

  ctx.fillText(
    "BEST "+high,
    W/2,
    78
  );

  ctx.shadowBlur=0;


  // START

  if(state==="start"){

    ctx.fillStyle=
      "rgba(10,20,18,.66)";

    ctx.fillRect(
      20,
      H*.24,
      W-40,
      275
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "bold 38px Arial";

    ctx.fillText(
      "DINO",
      W/2,
      H*.33
    );


    ctx.fillStyle="#ff3030";

    ctx.fillText(
      "INVADERS",
      W/2,
      H*.39
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "20px Arial";

    ctx.fillText(
      "CYBER RAPTOR ONLINE",
      W/2,
      H*.48
    );


    ctx.font=
      "15px Arial";

    ctx.fillText(
      "Fly the ruins. Destroy the invasion.",
      W/2,
      H*.53
    );


    ctx.font=
      "bold 22px Arial";

    ctx.fillText(
      "TAP TO START",
      W/2,
      H*.63
    );

  }


  // GAME OVER

  if(state==="dead"){

    ctx.fillStyle=
      "rgba(10,20,18,.72)";

    ctx.fillRect(
      25,
      H*.31,
      W-50,
      220
    );


    ctx.fillStyle="#ff3636";

    ctx.font=
      "bold 34px Arial";

    ctx.fillText(
      "SYSTEM DOWN",
      W/2,
      H*.40
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "22px Arial";

    ctx.fillText(
      "Score: "+score,
      W/2,
      H*.47
    );


    ctx.font=
      "bold 20px Arial";

    ctx.fillText(
      "TAP TO REBOOT",
      W/2,
      H*.56
    );

  }


  if(flash>0){

    ctx.fillStyle=
      "rgba(255,30,20,.07)";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }

}


// =====================================
// LOOP
// =====================================

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}


canvas.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();
    flap();

  }
);


loop();
</script>
</body>
</html>
