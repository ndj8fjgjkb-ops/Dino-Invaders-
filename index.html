<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Invaders V5.3</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#7fa9bf;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;

function resize(){

  dpr=Math.min(window.devicePixelRatio||1,1.25);

  W=innerWidth;
  H=innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);


// =====================================
// ASSETS
// =====================================

const backgroundImg=new Image();
backgroundImg.src=
"A2AE5350-54C3-4BD9-9090-6061E6C83F85.png";

const raptorImg=new Image();
raptorImg.src=
"8BBBE99D-BE50-463D-AB99-9356374B034D.png";

const enemyImg=new Image();
enemyImg.src=
"223E8F5F-AC53-4AC9-9DAE-CCF47D50F608.png";


// TRUE SEPARATE RUINS

const topRuinImg=new Image();
topRuinImg.src=
"8DCB4E86-B1D1-49F0-9B39-F9719AC68DFA.png";

const bottomRuinImg=new Image();
bottomRuinImg.src=
"3FC9FF8B-E285-4302-B4B1-4B4F22CC01EB.png";


// =====================================
// GAME STATE
// =====================================

let state="start";

let score=0;
let high=Number(localStorage.dinoHigh||0);

let frame=0;
let worldX=0;
let recoil=0;

let bullets=[];
let enemies=[];
let ruins=[];
let particles=[];

const player={
  x:82,
  y:300,
  vy:0,
  r:16
};


// =====================================
// RESET
// =====================================

function reset(){

  score=0;
  frame=0;
  worldX=0;
  recoil=0;

  player.y=H*.45;
  player.vy=0;

  bullets=[];
  enemies=[];
  ruins=[];
  particles=[];
}

function startGame(){

  reset();
  state="play";
}


// =====================================
// INPUT
// =====================================

function tap(){

  if(state==="start" || state==="dead"){

    startGame();
    return;
  }

  player.vy=-7.1;

  shoot();


  for(let i=0;i<4;i++){

    particles.push({

      x:player.x-35,
      y:player.y+8,

      vx:-2-Math.random()*2,
      vy:(Math.random()-.5)*2,

      life:15,

      size:
        2+
        Math.random()*3,

      type:"red"
    });
  }
}


function shoot(){

  bullets.push({

    x:player.x+46,
    y:player.y-4,

    vx:10,
    r:5
  });

  recoil=5;
}


// =====================================
// RUINS
// =====================================

function spawnRuin(){

  /*
    Wider passage because the new
    ruins are visually much larger.
  */

  const gap=Math.max(
    205,
    Math.min(240,H*.32)
  );

  const edgeMargin=95;

  const minCenter=
    edgeMargin+
    gap/2;

  const maxCenter=
    H-
    edgeMargin-
    gap/2;


  let center=H*.5;

  if(maxCenter>minCenter){

    center=
      minCenter+
      Math.random()*
      (maxCenter-minCenter);
  }


  ruins.push({

    x:W+190,

    /*
      This is now the gameplay
      collision width — not the
      full visual width.
    */

    hitW:128,

    visualW:255,

    top:center-gap/2,
    bottom:center+gap/2,

    passed:false
  });
}


// =====================================
// ENEMIES
// =====================================

function spawnEnemy(){

  enemies.push({

    x:W+90,

    baseY:
      105+
      Math.random()*
      Math.max(
        90,
        H-230
      ),

    y:H*.5,

    vx:
      2.6+
      Math.random()*.7,

    r:19,

    phase:
      Math.random()*
      Math.PI*2
  });
}


// =====================================
// PARTICLES
// =====================================

function explode(x,y,type){

  for(let i=0;i<12;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        18+
        Math.random()*10,

      size:
        2+
        Math.random()*4,

      type
    });
  }
}


// =====================================
// COLLISION
// =====================================

function circleHit(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  const rr=a.r+b.r;

  return(
    dx*dx+
    dy*dy<
    rr*rr
  );
}


function die(){

  if(state!=="play") return;

  state="dead";

  explode(
    player.x,
    player.y,
    "red"
  );


  if(score>high){

    high=score;
    localStorage.dinoHigh=high;
  }
}


// =====================================
// UPDATE
// =====================================

function update(){

  if(recoil>0){
    recoil*=.7;
  }


  // PARTICLES

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.life--;


    if(p.life<=0){
      particles.splice(i,1);
    }
  }


  if(state!=="play"){
    return;
  }


  frame++;

  worldX+=2.55;


  // PLAYER

  player.vy+=.38;
  player.y+=player.vy;


  if(
    player.y<18 ||
    player.y>H-28
  ){

    die();
  }


  // SPAWNING

  if(frame%126===0){
    spawnRuin();
  }


  if(frame%170===0){
    spawnEnemy();
  }


  // BULLETS

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    bullets[i].x+=
      bullets[i].vx;


    if(
      bullets[i].x>
      W+50
    ){

      bullets.splice(i,1);
    }
  }


  // RUINS

  for(
    let i=ruins.length-1;
    i>=0;
    i--
  ){

    const r=ruins[i];

    r.x-=2.55;


    /*
      Narrower invisible collision
      zone inside the large artwork.
    */

    const hitLeft=
      r.x+
      (r.visualW-r.hitW)/2;

    const hitRight=
      hitLeft+
      r.hitW;


    if(
      !r.passed &&
      hitRight<
      player.x
    ){

      r.passed=true;
      score++;
    }


    if(

      player.x+
      player.r>
      hitLeft &&

      player.x-
      player.r<
      hitRight &&

      (

        player.y-
        player.r<
        r.top ||

        player.y+
        player.r>
        r.bottom

      )

    ){

      die();
    }


    if(
      r.x<
      -r.visualW-40
    ){

      ruins.splice(i,1);
    }
  }


  // ENEMIES

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];

    e.x-=e.vx;


    e.y=
      e.baseY+
      Math.sin(
        frame*.05+
        e.phase
      )*13;


    if(circleHit(player,e)){
      die();
    }


    for(
      let j=bullets.length-1;
      j>=0;
      j--
    ){

      const b=bullets[j];

      const dx=b.x-e.x;
      const dy=b.y-e.y;

      const rr=b.r+e.r;


      if(
        dx*dx+
        dy*dy<
        rr*rr
      ){

        explode(
          e.x,
          e.y,
          "orange"
        );

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=2;

        break;
      }
    }


    if(
      enemies[i] &&
      enemies[i].x<-120
    ){

      enemies.splice(i,1);
    }
  }
}


// =====================================
// BACKGROUND
// =====================================

function drawBackground(){

  if(
    backgroundImg.complete &&
    backgroundImg.naturalWidth
  ){

    const iw=
      backgroundImg.naturalWidth;

    const ih=
      backgroundImg.naturalHeight;


    /*
      Cover screen while preserving
      image proportions.
    */

    const scale=
      Math.max(
        W/iw,
        H/ih
      );


    const sourceW=
      Math.min(
        iw,
        W/scale
      );

    const sourceH=
      Math.min(
        ih,
        H/scale
      );


    const maxX=
      Math.max(
        0,
        iw-sourceW
      );


    let sx=0;

    if(maxX>0){

      /*
        Slow background movement.
      */

      sx=
        (worldX*.055)%
        maxX;
    }


    const sy=
      Math.max(
        0,
        Math.min(
          ih-sourceH,
          (ih-sourceH)*.48
        )
      );


    const firstSourceW=
      Math.min(
        sourceW,
        iw-sx
      );


    const firstScreenW=
      firstSourceW*
      scale;


    ctx.drawImage(

      backgroundImg,

      sx,
      sy,

      firstSourceW,
      sourceH,

      0,
      0,

      firstScreenW,
      H
    );


    if(firstScreenW<W){

      const remaining=
        W-firstScreenW;


      ctx.drawImage(

        backgroundImg,

        0,
        sy,

        remaining/scale,
        sourceH,

        firstScreenW,
        0,

        remaining,
        H
      );
    }

  }else{

    ctx.fillStyle="#7fa9bf";

    ctx.fillRect(
      0,0,W,H
    );
  }


  /*
    Tiny atmospheric layer for
    character readability.
  */

  ctx.fillStyle=
    "rgba(170,195,185,.035)";

  ctx.fillRect(
    0,0,W,H
  );
}


// =====================================
// TOP RUIN
// =====================================

function drawTopRuin(r){

  const img=topRuinImg;


  if(
    !img.complete ||
    !img.naturalWidth
  ){

    ctx.fillStyle="#536451";

    ctx.fillRect(
      r.x,
      0,
      r.visualW,
      r.top
    );

    return;
  }


  const ratio=
    img.naturalHeight/
    img.naturalWidth;


  /*
    Big, chunky obstacle.
  */

  const drawW=
    r.visualW;

  const naturalH=
    drawW*
    ratio;


  /*
    We want the bottom edge of
    the artwork to meet the exact
    gameplay opening.
  */

  const drawH=
    Math.max(
      naturalH,
      r.top+70
    );


  const drawY=
    r.top-
    drawH+
    22;


  ctx.drawImage(

    img,

    r.x,
    drawY,

    drawW,
    drawH
  );
}


// =====================================
// BOTTOM RUIN
// =====================================

function drawBottomRuin(r){

  const img=
    bottomRuinImg;


  if(
    !img.complete ||
    !img.naturalWidth
  ){

    ctx.fillStyle="#536451";

    ctx.fillRect(
      r.x,
      r.bottom,
      r.visualW,
      H-r.bottom
    );

    return;
  }


  const ratio=
    img.naturalHeight/
    img.naturalWidth;


  const drawW=
    r.visualW;


  const naturalH=
    drawW*
    ratio;


  /*
    Bottom obstacle starts directly
    beneath the gameplay opening.
  */

  const available=
    H-r.bottom;


  const drawH=
    Math.max(
      naturalH,
      available+60
    );


  const drawY=
    r.bottom-18;


  ctx.drawImage(

    img,

    r.x,
    drawY,

    drawW,
    drawH
  );
}


// =====================================
// PLAYER
// =====================================

function drawPlayer(){

  ctx.save();


  ctx.translate(
    player.x-recoil,
    player.y
  );


  const angle=
    Math.max(
      -.17,
      Math.min(
        .20,
        player.vy*.023
      )
    );


  ctx.rotate(angle);


  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const w=155;

    const h=
      w*
      raptorImg.naturalHeight/
      raptorImg.naturalWidth;


    ctx.drawImage(

      raptorImg,

      -w*.47,
      -h*.5,

      w,
      h
    );

  }else{

    ctx.fillStyle="#d9302c";

    ctx.beginPath();

    ctx.arc(
      0,0,18,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.restore();
}


// =====================================
// ENEMY
// =====================================

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    e.x,
    e.y
  );

  ctx.scale(-1,1);


  if(
    enemyImg.complete &&
    enemyImg.naturalWidth
  ){

    const w=100;

    const h=
      w*
      enemyImg.naturalHeight/
      enemyImg.naturalWidth;


    ctx.drawImage(

      enemyImg,

      -w/2,
      -h/2,

      w,
      h
    );

  }else{

    ctx.fillStyle="#f7942d";

    ctx.beginPath();

    ctx.arc(
      0,0,20,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.restore();
}


// =====================================
// BULLETS
// =====================================

function drawBullets(){

  for(const b of bullets){

    ctx.fillStyle="#ff352d";

    ctx.beginPath();

    ctx.ellipse(
      b.x,
      b.y,
      13,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      b.x+4,
      b.y,
      2.5,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


// =====================================
// PARTICLES
// =====================================

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/28
      );


    ctx.fillStyle=
      p.type==="orange"
      ? "#ff9a25"
      : "#ff3933";


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.globalAlpha=1;
}


// =====================================
// HUD
// =====================================

function drawHUD(){

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.shadowColor=
    "rgba(0,0,0,.7)";

  ctx.shadowBlur=4;


  ctx.font=
    "bold 30px Arial";


  ctx.fillText(
    score,
    W/2,
    52
  );


  ctx.font=
    "bold 14px Arial";


  ctx.fillText(
    "BEST "+high,
    W/2,
    75
  );


  ctx.shadowBlur=0;
}


// =====================================
// START
// =====================================

function drawStart(){

  ctx.fillStyle=
    "rgba(12,28,24,.62)";


  ctx.fillRect(
    22,
    H*.25,
    W-44,
    260
  );


  ctx.textAlign="center";


  ctx.fillStyle="#fff";

  ctx.font=
    "bold 38px Arial";


  ctx.fillText(
    "DINO",
    W/2,
    H*.34
  );


  ctx.fillStyle="#ff3933";


  ctx.fillText(
    "INVADERS",
    W/2,
    H*.40
  );


  ctx.fillStyle="#fff";

  ctx.font=
    "16px Arial";


  ctx.fillText(
    "CYBER RAPTOR ONLINE",
    W/2,
    H*.49
  );


  ctx.font=
    "bold 21px Arial";


  ctx.fillText(
    "TAP TO START",
    W/2,
    H*.59
  );
}


// =====================================
// GAME OVER
// =====================================

function drawDead(){

  ctx.fillStyle=
    "rgba(12,28,24,.70)";


  ctx.fillRect(
    25,
    H*.32,
    W-50,
    210
  );


  ctx.textAlign="center";


  ctx.fillStyle="#ff3933";

  ctx.font=
    "bold 31px Arial";


  ctx.fillText(
    "SYSTEM DOWN",
    W/2,
    H*.41
  );


  ctx.fillStyle="#fff";

  ctx.font=
    "21px Arial";


  ctx.fillText(
    "Score: "+score,
    W/2,
    H*.48
  );


  ctx.font=
    "bold 20px Arial";


  ctx.fillText(
    "TAP TO REBOOT",
    W/2,
    H*.57
  );
}


// =====================================
// DRAW
// =====================================

function draw(){

  drawBackground();


  /*
    Separate images.
    No crop.
    No split.
    No flip.
  */

  for(const r of ruins){

    drawTopRuin(r);
    drawBottomRuin(r);
  }


  drawBullets();


  for(const e of enemies){
    drawEnemy(e);
  }


  drawParticles();

  drawPlayer();

  drawHUD();


  if(state==="start"){
    drawStart();
  }


  if(state==="dead"){
    drawDead();
  }
}


// =====================================
// LOOP
// =====================================

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}


canvas.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();
    tap();
  }
);


loop();

</script>
</body>
</html>
